# 共通定義は組織リポ Shaho-Well-being/.github の再利用ワークフローを参照
name: Claude Assistant

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  assist:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    uses: Shaho-Well-being/.github/.github/workflows/claude-assistant.yml@main
    secrets: inherit
