name: "AI Content Agent"

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      keyword:
        description: "ターゲットキーワード（省略時はAIが選定）"
        required: false
        default: ""

jobs:
  generate-blog-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: pnpm install
      - name: Generate blog post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          KEYWORD="${{ github.event.inputs.keyword }}"
          if [ -n "$KEYWORD" ]; then
            npx tsx scripts/generate-blog-post.ts --keyword "$KEYWORD"
          else
            npx tsx scripts/generate-blog-post.ts
          fi
      - name: Publish draft to microCMS
        id: microcms_publish
        continue-on-error: true
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          MICROCMS_BLOG_CATEGORY_ID: ${{ secrets.MICROCMS_BLOG_CATEGORY_ID }}
        run: npx tsx scripts/publish-blog-to-microcms.ts --draft
      - name: Warn if microCMS publish skipped or failed
        if: steps.microcms_publish.outcome != 'success'
        run: |
          echo "::warning::microCMS 下書きに失敗したか、Secrets（MICROCMS_SERVICE_DOMAIN / MICROCMS_API_KEY 等）が未設定です。docs/GITHUB_SECRETS.md を参照して登録してください。"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(blog): AI週次ブログ記事を追加"
          title: "[AI-Content] 週次ブログ記事 ${{ github.run_number }}"
          body: |
            ## AI コンテンツ部 週次ブログ記事

            microCMS のブログ API には **下書き** で入稿済み（Secrets 設定時）。管理画面で公開設定を確認してください。

            - [ ] 内容・事実確認
            - [ ] トーン確認
            - [ ] CTA リンク確認
            - [ ] microCMS で下書きレビュー・公開

            *承認してマージするとリポジトリの MDX が更新され、Vercel が自動デプロイします。*
          branch: "ai/content-${{ github.run_number }}"
          base: main
          labels: "AI-Content,blog"

  notify-on-failure:
    needs: generate-blog-post
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create failure Issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[AI-Content] ワークフロー失敗 #${context.runNumber}`,
              body: [
                '## コンテンツ生成ワークフローが失敗しました',
                '',
                `**Run**: [#${context.runNumber}](${runUrl})`,
                `**日時**: ${new Date().toISOString()}`,
                '',
                '### 確認事項',
                '- [ ] `GEMINI_API_KEY` が有効か',
                '- [ ] Gemini API のクォータ上限に達していないか',
                '- [ ] `MICROCMS_*` シークレットが正しいか',
                '- [ ] ログを確認し根本原因を特定',
                '',
                '---',
                '*この Issue は GitHub Actions で自動起票されました。*'
              ].join('\n'),
              labels: ['AI-Content', 'bug']
            });
